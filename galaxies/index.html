<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>GALAXIES</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GALAXIES">
  <meta property="og:url" content="https://ungoldman.com/galaxies/">
  <meta property="og:image" content="https://ungoldman.com/galaxies/galaxies-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A black hole at the center of a glowing blue-white galaxy simulation">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GALAXIES">
  <meta name="twitter:image" content="https://ungoldman.com/galaxies/galaxies-card.png">
  <link rel="stylesheet" href="https://ungoldman.com/style.css/site.css">
  <link rel="stylesheet" href="/index.css">
  <style>
    html, body { background: #000; color: #ddd; }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      image-rendering: optimizeQuality;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <header class="canvas-head">
    <a id="home" href="/" title="index" aria-label="back to index">&#8617;</a>
    <h1>Galaxies</h1>
    <span class="rule"></span>
    <nav id="controls" aria-label="Controls">
      <button id="randomize" title="Randomize (R)" aria-label="Randomize">&#10227;</button>
      <button popovertarget="help" title="Help" aria-label="Help">?</button>
      <button id="toggle" title="Settings (`)" aria-label="Settings" aria-expanded="false" aria-controls="settings">+</button>
    </nav>
  </header>
  <div id="settings" hidden></div>
  <div id="help" popover>
    <h2>Galaxies <button class="small" popovertarget="help" popovertargetaction="hide">Close</button></h2>
    <h3>Controls</h3>
    <table>
      <tr><th scope="row">drag, hold <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></th><td>orbit</td></tr>
      <tr><th scope="row">wheel, pinch, hold <kbd>Q</kbd> <kbd>E</kbd></th><td>zoom</td></tr>
      <tr><th scope="row">two-finger, middle, or <kbd>Space</kbd> drag, hold <kbd>I</kbd> <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd></th><td>pan</td></tr>
      <tr><th scope="row"><kbd>Home</kbd></th><td>reset view</td></tr>
      <tr><th scope="row"><kbd>X</kbd></th><td>pause rotation</td></tr>
      <tr><th scope="row"><kbd>C</kbd></th><td>lock view on randomize</td></tr>
      <tr><th scope="row"><kbd>R</kbd></th><td>randomize</td></tr>
      <tr><th scope="row"><kbd>Z</kbd></th><td>respawn galaxy</td></tr>
      <tr><th scope="row"><kbd>`</kbd></th><td>settings</td></tr>
    </table>
  </div>
  <canvas id="canvas"></canvas>

  <script src="/galaxies/galaxies.js"></script>
  <script>
    galaxies()
  </script>
</body>
</html>
