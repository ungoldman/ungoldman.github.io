<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>PARTICLES</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PARTICLES">
  <meta property="og:url" content="https://ungoldman.com/particles/">
  <meta property="og:image" content="https://ungoldman.com/particles/particles-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A field of colorful particles connected by fading lines">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PARTICLES">
  <meta name="twitter:image" content="https://ungoldman.com/particles/particles-card.png">
  <link rel="stylesheet" href="https://ungoldman.com/style.css/site.css">
  <link rel="stylesheet" href="/index.css">
  <style>
    html, body { background: #000; color: #ddd; }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      image-rendering: optimizeQuality;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <header class="canvas-head">
    <a id="home" href="/" title="index" aria-label="back to index">&#8617;</a>
    <h1>Particles</h1>
    <span class="rule"></span>
    <nav id="controls" aria-label="Controls">
      <button id="randomize" title="Randomize (R)" aria-label="Randomize">&#10227;</button>
      <button popovertarget="help" title="Help" aria-label="Help">?</button>
      <button id="toggle" title="Settings (`)" aria-label="Settings" aria-expanded="false" aria-controls="settings">+</button>
    </nav>
  </header>
  <div id="settings" hidden></div>
  <div id="help" popover>
    <h2>Particles <button class="small" popovertarget="help" popovertargetaction="hide">Close</button></h2>
    <h3>Controls</h3>
    <table>
      <tr><th scope="row">click, tap, or drag</th><td>add particles</td></tr>
      <tr><th scope="row"><kbd>R</kbd></th><td>randomize</td></tr>
      <tr><th scope="row"><kbd>X</kbd></th><td>pause</td></tr>
      <tr><th scope="row"><kbd>`</kbd></th><td>settings</td></tr>
    </table>
  </div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { mount } from './particles.js'
    addEventListener('router:leave', mount({ a: 1, distance: 96, speed: 1 }), { once: true })
  </script>
</body>
</html>
