---
layout: layouts/base.html
permalink: 404.html
title: Page not found
description: Nothing lives at this address.
stylesheets:
  - /index.css
---
<header class="canvas-head">
  <a id="home" href="/" title="index" aria-label="back to index">&#8617;</a>
  <h1>404</h1>
  <span class="rule"></span>
</header>
<main id="lost">
  <p>page not found</p>
  <a href="/">return to index</a>
</main>
<canvas id="canvas"></canvas>

<script type="module">
  import { mount } from '/particles/particles.js'
  import { winkControls } from '/router/controls.js'
  const lost = [...document.querySelectorAll('#lost > *')].filter((el) => !el.closest('[inert]'))
  // looked up now, since during a swap the id finds the incoming page's canvas
  const canvas = document.getElementById('canvas')
  const unmount = mount({ a: 1, distance: 256, particles: 42, speed: 1 })
  winkControls(lost, true)
  addEventListener('router:leave', (event) => {
    unmount(event)
    canvas.style.visibility = 'hidden'
    event.waitUntil(winkControls(lost, false))
  }, { once: true })
</script>
